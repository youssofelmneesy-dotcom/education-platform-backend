services:
  postgres-test:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: teching_test
    ports:
      - "5433:5432"
    volumes:
      - pgtestdata:/var/lib/postgresql/data

volumes:
  pgtestdata:
    name: teching_test_pgdata
