name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "feature/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: education_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d education_platform_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 4001
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/education_platform_test
      JWT_SECRET: ci-jwt-secret-with-at-least-32-characters
      JWT_EXPIRES_IN: 1h
      CORS_ORIGINS: http://localhost:3000
      REQUEST_BODY_LIMIT: 1mb
      URLENCODED_BODY_LIMIT: 1mb
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 100
      TRUST_PROXY: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply database migrations
        run: npm run prisma:deploy

      - name: Validate migration history
        run: npx prisma migrate status

      - name: Typecheck application
        run: npm run typecheck:app

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

      - name: Run smoke tests
        run: npm run test:smoke

      - name: Run integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build

      - name: Upload coverage artifact
        if: always() && hashFiles('coverage/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore
